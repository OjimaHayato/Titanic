[project]
name = "titanic"
version = "0.1.0"
description = "Kaggle「Titanic - Machine Learning from Disaster」の練習"
requires-python = ">=3.11"
dependencies = [
    "ipykernel>=7.0",
    "kagglehub>=1.0",
    "matplotlib>=3.10",
    "optuna>=4.0",
    "pandas>=3.0",
    "scikit-learn>=1.9",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
